{% extends "admin/index.html" %}
{% load i18n static %}

{% block content %}
<style>
    .stats-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
    }
    .stat-card {
        background: #fff;
        border-radius: 12px;
        padding: 25px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        border-bottom: 4px solid #6A1B9A;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        transition: transform 0.2s;
    }
    .stat-card:hover { transform: translateY(-5px); }
    .stat-value { font-size: 32px; font-weight: 800; color: #1a1a1a; margin: 10px 0; }
    .stat-label { font-size: 14px; font-weight: 600; color: #6A1B9A; text-transform: uppercase; letter-spacing: 1px; }
    .stat-icon { font-size: 24px; color: #FFD700; background: #6A1B9A33; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
</style>

<div class="stats-container">
    <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-user-graduate"></i></div>
        <div class="stat-value" id="total-students">...</div>
        <div class="stat-label">Total Students</div>
    </div>
    <div class="stat-card" style="border-bottom-color: #28a745;">
        <div class="stat-icon" style="background: #28a74533; color: #28a745;"><i class="fas fa-map-marker-alt"></i></div>
        <div class="stat-value" id="students-active">...</div>
        <div class="stat-label">Active on Campus</div>
    </div>
    <div class="stat-card" style="border-bottom-color: #FFD700;">
        <div class="stat-icon" style="background: #FFD70033; color: #FFD700;"><i class="fas fa-calendar-check"></i></div>
        <div class="stat-value" id="attendance-today">...</div>
        <div class="stat-label">Attendance Today</div>
    </div>
    <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-book"></i></div>
        <div class="stat-value" id="total-notes">...</div>
        <div class="stat-label">Study Materials</div>
    </div>
</div>

<script>
    // Fetch live stats from the backend
    fetch('/api/admin-stats/')
        .then(res => res.json())
        .then(data => {
            document.getElementById('total-students').innerText = data.total_students;
            document.getElementById('students-active').innerText = data.active_students;
            document.getElementById('attendance-today').innerText = data.attendance_rate + '%';
            document.getElementById('total-notes').innerText = data.total_notes;
        });
</script>

{{ block.super }}
{% endblock %}
